    <!-- Open Graph / Facebook -->

    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- JSON-LD Structured Data for Rich Google Search Results -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "RestStudio",
      "alternateName": ["RestStudio API Workspace", "RestStudio REST Client"],
      "url": "https://suhail.top",
      "description": "RestStudio is a privacy-first, offline-capable REST API workspace and Postman alternative designed by Suhail Akhtar.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "All",
      "author": {
        "@type": "Person",
        "name": "Suhail Akhtar",
        "url": "https://suhail.top"
      },
      "creator": {
        "@type": "Person",
        "name": "Suhail Akhtar",
        "url": "https://suhail.top"
      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "softwareVersion": "1.0"
    }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/30 selection:text-emerald-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then((registration) => {
              console.log('[RestStudio SW] Registered successfully:', registration.scope);
            })
            .catch((error) => {
              console.warn('[RestStudio SW] Registration failed:', error);
            });
        });
      }
    </script>
  </body>
